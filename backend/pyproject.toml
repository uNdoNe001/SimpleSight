[project]
name = "simplesight-backend"
version = "0.0.1"
description = "SimpleSight OSINT platform - backend API, collectors, and workers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "dnspython>=2.6",
    "sqlalchemy>=2.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
    "email-validator>=2.2",
    "psycopg2-binary>=2.9",
    "rq>=1.16",
    "redis>=5.0",
    "reportlab>=4.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "collectors", "workers"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()/Security() in argument defaults is the intended idiom.
ignore = ["B008"]
